# GoReleaser configuration for stupidict.
#
# The application is pure Go (CGO_ENABLED=0), including native audio playback,
# so every target is cross-compiled from a single host without a C toolchain.
# See .github/workflows/release.yml.
version: 2

project_name: stupidict

before:
  hooks:
    - go mod download

builds:
  - id: stupidict
    main: ./cmd/stupidict
    binary: stupidict
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w -X 'main.version=v{{ .Version }}' -X 'main.commit={{ .ShortCommit }}' -X 'main.buildDate={{ .Date }}'
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: mingcheng
    name: stupidict
  prerelease: auto
  footer: |
    Dictionary and audio data are downloaded on first run from the upstream
    [data-3 release](https://github.com/cholf5/stupid-dict/releases/tag/data-3).
